name: Verify production worker changes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-worker.yml'
      - 'deploy/**'
      - 'scripts/**'
      - 'worker/**'
      - 'supabase/migrations/**'
      - 'Dockerfile.worker'
      - 'docker-compose.worker.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
