name: Verify production worker changes

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-worker.yml'
      - 'deploy/**'
      - 'scripts/**'
      - 'worker/**'
      - 'supabase/migrations/**'
      - 'Dockerfile.worker'
      - 'docker-compose.worker.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-worker-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: maetajak_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      COPY_QA_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/maetajak_qa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:postgres
      - run: npm run build
